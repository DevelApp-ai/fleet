# fleet heat cap (docs/perf.md). Install as ~/.config/systemd/user/copilot.slice.d/50-cpu.conf. Undo: rm this file && systemctl --user daemon-reload
[Slice]
# At most 6 cores' worth of CPU for all copilot sessions together.
CPUQuota=600%
# E-cores only. Takes effect only once user@.service delegates cpuset (root step in docs/perf.md).
AllowedCPUs=12-19
